defaults: &defaults
  host: mongo
  port: 27017
  options:
    w: 1
    pool_size: 1
    slave_ok: false
    ssl: false

development:
  <<: *defaults
  database: esmx_development

test:
  <<: *defaults
  database: esmx_test
  w: 0

# set these environment variables on your prod server
production:
  <<: *defaults
  database: esmx
  username: <%= ENV['MONGO_USERNAME'] %>
  password: <%= ENV['MONGO_PASSWORD'] %>
